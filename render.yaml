services:
  - type: web
    name: collegeai-backend
    runtime: node
    rootDir: CollegeAI---RAG-College-Assistant-main
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000
